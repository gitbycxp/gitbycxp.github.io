<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>关于 · 像素笔记</title>
    <meta
      name="description"
      content="关于这个像素风小站：为什么用莫兰迪配色、用了哪些工具、技术栈和字体许可。"
    />
    <meta name="theme-color" content="#e7e3dc" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="关于 · 像素笔记" />
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <script>
      (function () {
        var saved = {};
        try {
          saved = JSON.parse(localStorage.getItem("pixel-morandi") || "{}") || {};
        } catch (e) {
          saved = {};
        }
        var theme =
          saved.theme ||
          (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dusk"
            : "light");
        document.documentElement.setAttribute("data-theme", theme);
        if (saved.text) document.documentElement.setAttribute("data-text", saved.text);
      })();
    </script>
    <script src="assets/js/data.js" defer></script>
    <script src="assets/js/site.js" defer></script>
  </head>
  <body data-page="about">
    <a class="skip-link" href="#main">跳到主要内容</a>
    <div class="progress" data-progress></div>
    <canvas class="sparkle-layer" data-sparkles aria-hidden="true"></canvas>

    <header class="site-header">
      <div class="wrap site-header__inner">
        <a class="brand" href="index.html">
          <span class="brand__mark">
            <img src="assets/img/mark.svg" width="48" height="32" alt="" />
          </span>
          <span class="brand__text">
            <span class="brand__name" data-bind="meta.siteName">像素笔记</span>
            <span class="brand__tag" data-bind="owner.role">像素爱好者 · 前端玩家</span>
          </span>
        </a>

        <nav class="site-nav" id="site-nav" data-nav aria-label="主导航"></nav>

        <div class="header-tools">
          <button class="icon-btn" type="button" data-theme-toggle aria-label="切换主题">
            <span class="px-icon px-icon--sun" data-theme-glyph></span>
          </button>
          <button
            class="icon-btn nav-toggle"
            type="button"
            data-nav-toggle
            aria-expanded="false"
            aria-controls="site-nav"
            aria-label="打开菜单"
          >
            <span class="px-icon px-icon--menu"></span>
          </button>
        </div>
      </div>
    </header>

    <main id="main">
      <section class="page-head">
        <div class="wrap">
          <p class="eyebrow" data-bind="about.eyebrow">ABOUT</p>
          <h1 data-bind="about.title">关于这个小站</h1>
        </div>
      </section>

      <section class="section section--tight">
        <div class="wrap">
          <div class="about__grid">
            <div class="portrait" data-reveal>
              <div class="portrait__frame" data-portrait></div>
              <div class="portrait__cap">
                <span data-bind="owner.name">cxp</span>
                <span data-handle>@gitbycxp</span>
              </div>
            </div>
            <div class="prose prose--wide" data-about-text></div>
          </div>
        </div>
      </section>

      <section class="section section--tight">
        <div class="wrap">
          <div class="grid grid--3" data-about-cards></div>
        </div>
      </section>

      <section class="section">
        <div class="wrap">
          <div class="section-head">
            <p class="eyebrow" data-bind="toolbox.eyebrow">TOOLBOX</p>
            <h2 data-bind="toolbox.title">常用工具</h2>
          </div>
          <div class="grid grid--4" data-toolbox></div>
        </div>
      </section>

      <section class="section">
        <div class="wrap">
          <div class="grid grid--2" style="gap: 48px; align-items: start">
            <div>
              <p class="eyebrow" data-bind="siteInfo.eyebrow">COLOPHON</p>
              <h2 data-bind="siteInfo.title">这个站是怎么做的</h2>
              <p class="lead">
                没有打包工具，也没有依赖树。浏览器直接读源码，改一行刷新就能看到结果。
              </p>
            </div>
            <div class="info-list" data-site-info></div>
          </div>
        </div>
      </section>

      <section class="section section--tight">
        <div class="wrap">
          <div class="panel brackets panel--flat">
            <div class="row" style="justify-content: space-between; gap: 24px">
              <div>
                <h2 style="margin-bottom: 8px">想聊点什么？</h2>
                <p class="lead" style="margin: 0">邮件最靠谱，通常几天内会回。</p>
              </div>
              <a class="btn" href="contact.html">
                <span>联系方式</span>
                <span class="btn__arrow" aria-hidden="true">▸</span>
              </a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <div class="site-footer__top">
          <div class="site-footer__brand">
            <span class="brand__name" data-bind="meta.siteName">像素笔记</span>
            <p data-bind="owner.footerNote">用像素和莫兰迪色搭建。</p>
          </div>
          <div>
            <div class="footer-title">导航</div>
            <ul class="footer-links" data-footer-links></ul>
          </div>
          <div>
            <div class="footer-title">找到我</div>
            <ul class="footer-links" data-footer-social></ul>
          </div>
        </div>

        <div class="site-footer__bottom">
          <span
            >© <span data-year>2026</span> <span data-bind="owner.name">cxp</span> ·
            <span data-handle>@gitbycxp</span></span
          >
          <div class="footer-controls">
            <div class="control-group">
              <span class="control-group__label">主题</span>
              <button class="toggle-btn" type="button" data-theme-toggle aria-label="切换主题">
                <span data-theme-name>浅色</span>
              </button>
            </div>
            <div class="control-group">
              <span class="control-group__label">显示</span>
              <button class="toggle-btn" type="button" data-text-toggle aria-pressed="false">
                字号：标准
              </button>
              <button class="toggle-btn" type="button" data-crt-toggle aria-pressed="false">
                扫描线
              </button>
            </div>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
