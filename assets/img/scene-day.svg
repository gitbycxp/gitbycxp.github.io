<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220"
  shape-rendering="crispEdges" role="img" aria-label="白天的像素山谷">
  <defs>
    
    <pattern id="dither" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="rgba(255,255,255,0.5)" opacity="0.35"/>
    </pattern>
  </defs>
  <style>
    .cloud { animation: drift linear infinite; }
    @keyframes drift {
      from { transform: translateX(0); }
      to   { transform: translateX(420px); }
    }
    .star { animation: twinkle 3.6s steps(1, end) infinite; }
    @keyframes twinkle {
      0%, 60% { opacity: 1; }
      61%, 100% { opacity: 0.25; }
    }
    .hero-idle { animation: idle 2.4s steps(1, end) infinite; }
    @keyframes idle {
      0%, 49% { transform: translate(132px, 124px); }
      50%, 100% { transform: translate(132px, 128px); }
    }
    .frame-blink { animation: blink 4.8s steps(1, end) infinite; }
    @keyframes blink {
      0%, 92% { opacity: 0; }
      93%, 97% { opacity: 1; }
      98%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cloud, .star, .hero-idle, .frame-blink { animation: none; }
      .frame-blink { opacity: 0; }
    }
  </style>
